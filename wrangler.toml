name       = "owasp-oasis-app-preview"
main       = "worker.js"
compatibility_date = "2026-08-21"
workers_dev = false
find_additional_modules = false

# ── Tell Wrangler to treat .html as text modules ──
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# ── Preview route ──
[[routes]]
pattern = "preview.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

# ── D1 Database ──
[[d1_databases]]
binding              = "DB"
database_name        = "oasis-db"
database_id          = "d14003aa-36a7-42f3-8374-7cd060b56333"
migrations_dir       = "migrations"

# ── KV Namespace (rate limiting) ──
[[kv_namespaces]]
binding    = "RATE_KV"
id         = "4668dfe626b144de82ceec91df80c7ce"
preview_id = "0f2cd5c4bcd04b109141035bb2d69d0a"

# ── Environment variables ──
[vars]
ENVIRONMENT = "preview"

# ── Workers Logs ──
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# ── Production environment ──
[env.production]
name = "owasp-oasis"
workers_dev = true

[[env.production.routes]]
pattern = "www.owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

[[env.production.routes]]
pattern = "owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

[[env.production.routes]]
pattern = "www.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

[[env.production.routes]]
pattern = "owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

[[env.production.d1_databases]]
binding              = "DB"
database_name        = "oasis-db"
database_id          = "d14003aa-36a7-42f3-8374-7cd060b56333"
migrations_dir       = "migrations"

[[env.production.kv_namespaces]]
binding = "RATE_KV"
id      = "4668dfe626b144de82ceec91df80c7ce"

[env.production.vars]
ENVIRONMENT = "production"
# After creating matching custom contact properties in HubSpot, add:
# HUBSPOT_PROPERTY_MAP = """{"github":"oasis_github","role":"oasis_role","source":"oasis_source","organization":"oasis_organization","submitted_at":"oasis_submitted_at"}"""

[env.production.triggers]
crons = ["15 * * * *"]
