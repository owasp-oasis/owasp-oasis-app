name               = "owasp-oasis-app-preview"
main               = "dist-worker/index.js"
compatibility_date = "2026-08-24"
workers_dev        = false

# Workers Free applies its CPU and subrequest ceilings automatically. Do not add
# a [limits] block here: custom runtime limits require the paid Standard model.

# Persist privacy-safe Worker logs and invocation metadata. Traces remain disabled.
[observability]
enabled            = false
head_sampling_rate = 1

[observability.logs]
enabled            = true
head_sampling_rate = 1
persist            = true
invocation_logs    = true

[observability.traces]
enabled            = false
persist            = true
head_sampling_rate = 1

# ── Static assets (React SPA) ──
[assets]
directory          = "./dist"
binding            = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first   = true

# ── Routes ──
[[routes]]
pattern   = "preview.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

# ── D1 Database ──
[[d1_databases]]
binding       = "DB"
database_name = "oasis-db"
database_id   = "d14003aa-36a7-42f3-8374-7cd060b56333"
migrations_dir = "migrations"

# ── KV Namespace (rate limiting) ──
[[kv_namespaces]]
binding    = "RATE_KV"
id         = "4668dfe626b144de82ceec91df80c7ce"
preview_id = "0f2cd5c4bcd04b109141035bb2d69d0a"

# ── Environment variables ──
[vars]
ENVIRONMENT          = "preview"
OAUTH_CALLBACK_URL   = "https://preview.owasp-oasis.org/api/auth/callback"

# ── Cron triggers ──
[triggers]
crons = ["30 2 * * *"]

# Preview is strictly read-only with respect to canonical Workspace tables.
[[workflows]]
name       = "oasis-shadow-sync-preview"
binding    = "SHADOW_SYNC_WORKFLOW"
class_name = "ShadowSyncWorkflow"

# ── Production environment ──
[env.production]
name = "owasp-oasis"

[[env.production.routes]]
pattern   = "www.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

[[env.production.routes]]
pattern   = "owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

[[env.production.routes]]
pattern   = "www.owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

[[env.production.routes]]
pattern   = "owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

# ── D1 Database (same DB as preview) ──
[[env.production.d1_databases]]
binding       = "DB"
database_name = "oasis-db"
database_id   = "d14003aa-36a7-42f3-8374-7cd060b56333"
migrations_dir = "migrations"

# ── KV Namespace (rate limiting) ──
[[env.production.kv_namespaces]]
binding = "RATE_KV"
id      = "4668dfe626b144de82ceec91df80c7ce"

[env.production.vars]
ENVIRONMENT        = "production"
OAUTH_CALLBACK_URL = "https://www.owasp-oasis.org/api/auth/callback"

[env.production.triggers]
crons = ["0 */4 * * *", "15 * * * *"]

# The production canonical writer is disabled in D1 until an administrator
# accepts a manual canary and enables its schedule.
[[env.production.workflows]]
name       = "oasis-canonical-sync"
binding    = "CANONICAL_SYNC_WORKFLOW"
class_name = "CanonicalSyncWorkflow"
