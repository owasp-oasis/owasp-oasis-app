name       = "owasp-oasis"
main       = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

# ── .com routes ──
[[routes]]
pattern = "www.owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

[[routes]]
pattern = "owasp-oasis.com/*"
zone_name = "owasp-oasis.com"

# ── .org routes ──
[[routes]]
pattern = "www.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

[[routes]]
pattern = "owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

# ── D1 Database ──
[[d1_databases]]
binding              = "DB"
database_name        = "oasis-db"
database_id          = "d14003aa-36a7-42f3-8374-7cd060b56333"

# ── KV Namespace (rate limiting) ──
[[kv_namespaces]]
binding    = "RATE_KV"
id         = "4668dfe626b144de82ceec91df80c7ce"
preview_id = "0f2cd5c4bcd04b109141035bb2d69d0a"

# ── Cron triggers ──
[triggers]
crons = ["0 */4 * * *"]

# ── Environment variables ──
[vars]
ENVIRONMENT = "production"

# ── Preview environment — deploys to preview.owasp-oasis.bluejar.org ──
[env.preview]
name = "owasp-oasis-preview"
workers_dev = false

[env.preview.assets]
directory = "./dist"
binding   = "ASSETS"
not_found_handling = "single-page-application"

[[env.preview.routes]]
pattern = "preview.owasp-oasis.bluejar.org"
custom_domain = true

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "oasis-db"
database_id   = "2198ce30-3090-4805-884a-317dc6b9db58"

[[env.preview.kv_namespaces]]
binding = "RATE_KV"
id      = "6dabc90e4b6b432cac87fb1c7a2ab631"

[env.preview.vars]
ENVIRONMENT = "production"

[env.preview.triggers]
crons = ["0 */4 * * *"]
