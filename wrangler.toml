name               = "owasp-oasis-app-preview"
main               = "worker.js"
compatibility_date = "2024-01-01"
workers_dev        = false

# ── Static assets (React SPA) ──
[assets]
directory          = "./dist"
binding            = "ASSETS"
not_found_handling = "single-page-application"

# ── Routes ──
[[routes]]
pattern   = "preview.owasp-oasis.org/*"
zone_name = "owasp-oasis.org"

# ── D1 Database ──
[[d1_databases]]
binding       = "DB"
database_name = "oasis-db"
database_id   = "d14003aa-36a7-42f3-8374-7cd060b56333"

# ── KV Namespace (rate limiting) ──
[[kv_namespaces]]
binding    = "RATE_KV"
id         = "4668dfe626b144de82ceec91df80c7ce"
preview_id = "0f2cd5c4bcd04b109141035bb2d69d0a"

# ── Environment variables ──
[vars]
ENVIRONMENT = "preview"

# ── Cron triggers ──
[triggers]
crons = ["0 */4 * * *"]
