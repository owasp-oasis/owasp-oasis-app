name: Change, feature, or improvement
description: Propose a new capability or a material improvement to OASIS.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the user problem and desired outcome. Please seek maintainer agreement before investing in substantial implementation work.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, pull requests, and ROADMAP.md for related work.
          required: true
        - label: I have not included secrets, tokens, personal data, or non-public vulnerability details.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, what are they trying to do, and what prevents or slows them today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible or operational result without assuming a particular implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Explain a possible implementation, workflow, or interface if you have one.
  - type: dropdown
    id: areas
    attributes:
      label: Affected areas
      multiple: true
      options:
        - Frontend or user experience
        - Worker API
        - Authentication or authorization
        - D1 schema or stored data
        - GitHub sync or scheduled jobs
        - Analytics or engagement metrics
        - HubSpot or another external integration
        - Deployment or Cloudflare configuration
        - Documentation
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make the proposal complete.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Scope and non-goals
      description: Identify boundaries, deferred work, compatibility needs, or behavior that should not change.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or other approaches and why they may be less suitable.
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, data, and operational considerations
      description: Call out permissions, user data, migrations, external services, API budgets, or deployment risk.
