name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main          # Auto-deploy to production on push to main
  pull_request:
    branches:
      - main          # Run checks on PRs (no deploy)
  workflow_dispatch:  # Allow manual deploy from GitHub UI

jobs:
  # ── Run on every PR — checks code before merging ──────────────
  lint:
    name: Validate files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check index.html exists
        run: test -f index.html && echo "✅ index.html found"

      - name: Check worker.js exists
        run: test -f worker.js && echo "✅ worker.js found"

      - name: Check wrangler.toml exists
        run: test -f wrangler.toml && echo "✅ wrangler.toml found"

      - name: Validate worker.js syntax
        run: node --check worker.js && echo "✅ worker.js syntax OK" || echo "⚠️ worker.js has syntax issues"

  # ── Deploy to production — only on push to main ───────────────
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: lint                    # Only deploy if lint passes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deployment summary
        run: |
          echo "## ✅ Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | https://www.owasp-oasis.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **Also live** | https://www.owasp-oasis.org |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
