name: Deploy Preview to Cloudflare Workers

on:
  push:
    branches:
      - preview       # Auto-deploy to preview on push to preview branch
  workflow_dispatch:  # Allow manual deploy from GitHub UI

jobs:
  # ── Validate files before deploying ───────────────────────────
  lint:
    name: Validate files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check index.html exists
        run: test -f index.html && echo "✅ index.html found"

      - name: Check worker.js exists
        run: test -f worker.js && echo "✅ worker.js found"

      - name: Check wrangler.toml exists
        run: test -f wrangler.toml && echo "✅ wrangler.toml found"

      - name: Validate worker.js syntax
        run: node --check worker.js && echo "✅ worker.js syntax OK" || echo "⚠️ worker.js has syntax issues"

  # ── Deploy to preview.owasp-oasis.org ─────────────────────────
  deploy-preview:
    name: Deploy to Preview
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers (Preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name owasp-oasis-preview

      - name: Preview Deployment summary
        run: |
          echo "## ✅ Preview Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | https://preview.owasp-oasis.org |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
