name: Sync DB to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  sync:
    name: Export registrations to Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Google Sheets sync
        run: |
          echo "Triggering Google Sheets sync..."
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 2 \
            -L \
            -H "Accept: application/json" \
            "${{ secrets.GOOGLE_SHEETS_WEBHOOK }}")
          
          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json || echo "(empty)"
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "302" ]; then
            echo "✅ Sync triggered successfully"
          else
            echo "❌ Sync failed with HTTP $RESPONSE"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Sync Result" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date)" >> $GITHUB_STEP_SUMMARY
