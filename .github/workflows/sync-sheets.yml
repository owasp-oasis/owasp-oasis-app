name: Sync DB to Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  sync:
    name: Export registrations to Google Sheets
    runs-on: ubuntu-latest

    steps:
      - name: Fetch registrations from Cloudflare Worker
        run: |
          echo "Fetching registrations..."
          curl -s \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            "https://www.owasp-oasis.org/api/admin/registrations" \
            -o /tmp/registrations.json

          echo "Response:"
          cat /tmp/registrations.json

          COUNT=$(cat /tmp/registrations.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('registrations', [])))")
          echo "Total registrations: $COUNT"

      - name: Push to Google Sheets
        run: |
          echo "Syncing to Google Sheets..."
          RESPONSE=$(curl -s -o /tmp/sheets_response.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d @/tmp/registrations.json \
            -L \
            --max-time 30 \
            "${{ secrets.GOOGLE_SHEETS_WEBHOOK }}?secret=${{ secrets.ADMIN_SECRET }}")

          echo "HTTP Status: $RESPONSE"
          cat /tmp/sheets_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Sync failed with HTTP $RESPONSE"
            exit 1
          fi
          echo "✅ Sync successful"

      - name: Summary
        if: always()
        run: |
          echo "## Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Time: $(date)" >> $GITHUB_STEP_SUMMARY
