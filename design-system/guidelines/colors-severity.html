<!-- @dsCard group="Colors" viewport="700x110" subtitle="Critical / high / medium / low chip pairs (AA)" name="Severity" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row" style="gap:12px;align-items:center"><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--sev-critical-bg);color:var(--sev-critical-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Critical</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--sev-high-bg);color:var(--sev-high-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">High</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--sev-medium-bg);color:var(--sev-medium-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Medium</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--sev-low-bg);color:var(--sev-low-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Low</span></div><p class="lbl" style="margin-top:16px">Severity is the only thing that colors a finding. CWE IDs stay neutral mono text.</p></body></html>
