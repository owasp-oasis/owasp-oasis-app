<!-- @dsCard group="Spacing" viewport="700x130" subtitle="8px is the default for cards and buttons" name="Corner radii" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:3px"></div><span class="n">xs</span><span class="h">3px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:4px"></div><span class="n">sm</span><span class="h">4px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:6px"></div><span class="n">md</span><span class="h">6px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:7px"></div><span class="n">btn</span><span class="h">7px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:8px"></div><span class="n">lg</span><span class="h">8px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:10px"></div><span class="n">xl</span><span class="h">10px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:12px"></div><span class="n">2xl</span><span class="h">12px</span></div><div class="sw" style="align-items:center"><div style="width:64px;height:48px;background:var(--blue-soft);border:1px solid var(--line-strong);border-radius:100px"></div><span class="n">pill</span><span class="h">100px</span></div></div></body></html>
