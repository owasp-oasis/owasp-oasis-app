<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Navy-tinted shadows; most surfaces use border only" name="Elevation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row" style="background:var(--paper);padding:18px;border-radius:8px;gap:18px"><div class="sw" style="align-items:center"><div style="width:90px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow)"></div><span class="h">--shadow</span><span class="lbl">cards / modals</span></div><div class="sw" style="align-items:center"><div style="width:90px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-menu)"></div><span class="h">--shadow-menu</span><span class="lbl">dropdowns</span></div><div class="sw" style="align-items:center"><div style="width:90px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-strong)"></div><span class="h">--shadow-strong</span><span class="lbl">toast</span></div><div class="sw" style="align-items:center"><div style="width:90px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-btn-blue)"></div><span class="h">--shadow-btn-blue</span><span class="lbl">blue button</span></div><div class="sw" style="align-items:center"><div style="width:90px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-pill)"></div><span class="h">--shadow-pill</span><span class="lbl">account pill</span></div></div></body></html>
