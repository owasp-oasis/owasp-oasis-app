<!-- @dsCard group="Colors" viewport="700x100" subtitle="Needs review → Trusted → Accepted; Withdrawn, Rejected" name="Candidate-fix status" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row" style="gap:10px"><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--status-needs-bg);color:var(--status-needs-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Needs review</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--status-trusted-bg);color:var(--status-trusted-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Trusted</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--status-accepted-bg);color:var(--status-accepted-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Accepted</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--status-withdrawn-bg);color:var(--status-withdrawn-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Withdrawn</span><span style="display:inline-flex;padding:3px 10px;border-radius:100px;background:var(--status-rejected-bg);color:var(--status-rejected-fg);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Rejected</span></div></body></html>
