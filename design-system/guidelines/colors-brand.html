<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--blue-dark)"></div><span class="n">Navy</span><span class="h">#0b4f8a</span></div><div class="sw"><div class="chip" style="background:var(--blue)"></div><span class="n">Blue</span><span class="h">#0f6fcf</span></div><div class="sw"><div class="chip" style="background:var(--blue-mid)"></div><span class="n">Mid Blue</span><span class="h">#1558d6</span></div><div class="sw"><div class="chip" style="background:var(--blue-soft)"></div><span class="n">Blue Soft</span><span class="h">#e7f1ff</span></div><div class="sw"><div class="chip" style="background:var(--green)"></div><span class="n">Green</span><span class="h">#0d9e52</span></div><div class="sw"><div class="chip" style="background:var(--green-bright)"></div><span class="n">Green Bright</span><span class="h">#4cd964</span></div><div class="sw"><div class="chip" style="background:var(--green-soft)"></div><span class="n">Green Soft</span><span class="h">#e8f9ef</span></div><div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="n">Paper</span><span class="h">#f7fbff</span></div></div></body></html>
