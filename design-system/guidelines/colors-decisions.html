<!-- @dsCard group="Colors" viewport="700x150" subtitle="Accept / Modify / Reject / Duplicate: solid, soft, text" name="Validator decisions" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--dec-accept);border:0"></div><div style="display:flex;gap:6px"><div class="chip" style="height:24px;flex:1;background:var(--dec-accept-bg)"></div></div><span class="n" style="color:var(--dec-accept-fg)">Accept</span></div><div class="sw"><div class="chip" style="background:var(--dec-modify);border:0"></div><div style="display:flex;gap:6px"><div class="chip" style="height:24px;flex:1;background:var(--dec-modify-bg)"></div></div><span class="n" style="color:var(--dec-modify-fg)">Modify</span></div><div class="sw"><div class="chip" style="background:var(--dec-reject);border:0"></div><div style="display:flex;gap:6px"><div class="chip" style="height:24px;flex:1;background:var(--dec-reject-bg)"></div></div><span class="n" style="color:var(--dec-reject-fg)">Reject</span></div><div class="sw"><div class="chip" style="background:var(--dec-duplicate);border:0"></div><div style="display:flex;gap:6px"><div class="chip" style="height:24px;flex:1;background:var(--dec-duplicate-bg)"></div></div><span class="n" style="color:var(--dec-duplicate-fg)">Duplicate</span></div></div></body></html>
