<!-- @dsCard group="Colors" viewport="700x140" subtitle="Borders are tinted blue, never gray; one gradient" name="Lines & brand gradient" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--white);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:76px;display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:8px;border:1px solid var(--line)}
.n{font-size:12px;font-weight:600}.h{font-family:var(--mono);font-size:10.5px;color:var(--muted)}.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#fff;border:1px solid var(--line)"></div><span class="n">--line</span><span class="h">rgba(15,111,207,.16)</span></div><div class="sw"><div class="chip" style="background:#fff;border:1px solid var(--line-strong)"></div><span class="n">--line-strong</span><span class="h">rgba(15,111,207,.28)</span></div><div class="sw"><div class="chip" style="background:#fff;border:1px solid var(--gray-200)"></div><span class="n">--gray-200 divider</span><span class="h">inner rules</span></div><div class="sw" style="flex:2"><div class="chip" style="background:var(--gradient-hero);border:0"></div><span class="n">--gradient-hero</span><span class="h">135° navy → blue</span></div></div></body></html>
