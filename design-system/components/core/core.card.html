<!-- @dsCard group="Components" viewport="700x260" name="Core" subtitle="Button, Eyebrow, Card, Avatar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px;background:#fff}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script></head><body><div id="root"></div>
<script type="text/babel">

const V = {
  primary: { background: 'var(--green-bright)', color: 'var(--blue-dark)', border: '1px solid transparent' },
  secondary: { background: 'var(--blue)', color: 'var(--white)', border: '1px solid transparent', boxShadow: 'var(--shadow-btn-blue)' },
  outline: { background: 'transparent', color: 'var(--blue)', border: '2px solid var(--blue)' },
  quiet: { background: 'var(--white)', color: 'var(--blue-dark)', border: '1px solid var(--line-strong)' },
  'ghost-light': { background: 'transparent', color: 'var(--white)', border: '2px solid rgba(255,255,255,.5)' },
};
function Button({ variant = 'primary', size = 'lg', iconRight, disabled, onClick, children }) {
  const [h, setH] = React.useState(false);
  const s = size === 'lg' ? { minHeight: 42, padding: '10px 20px', fontSize: 16 } : { minHeight: 38, padding: '8px 16px', fontSize: 14 };
  return (
    <button disabled={disabled} onClick={onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
      style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, borderRadius: 8, fontFamily: 'var(--sans)', fontWeight: 700, whiteSpace: 'nowrap', cursor: disabled ? 'not-allowed' : 'pointer', transition: 'transform var(--dur), box-shadow var(--dur), background var(--dur), opacity var(--dur)', ...V[variant], ...s, opacity: disabled ? .45 : h ? .9 : 1, transform: h && !disabled ? 'translateY(-1px)' : 'none' }}>
      {children}{iconRight}
    </button>
  );
}

const T = { blue: 'var(--blue)', green: 'var(--green-bright)', light: 'rgba(255,255,255,.65)', muted: 'var(--muted)' };
function Eyebrow({ tone = 'blue', children }) {
  return <span style={{ fontFamily: 'var(--mono)', fontSize: 12, fontWeight: 700, letterSpacing: '.14em', textTransform: 'uppercase', color: T[tone] }}>{children}</span>;
}

function Card({ padding = 22, elevated, selected, children }) {
  return <div style={{ background: selected ? 'var(--blue-soft)' : 'var(--white)', border: '1px solid ' + (selected ? 'var(--line-strong)' : 'var(--line)'), borderRadius: 8, padding, boxShadow: elevated ? 'var(--shadow)' : 'none' }}>{children}</div>;
}

function Avatar({ login, size = 28, src }) {
  const [err, setErr] = React.useState(false);
  const init = login.replace(/[^a-z0-9]/gi, '').slice(0, 2).toUpperCase();
  const url = src || `https://github.com/${login}.png?size=${size * 2}`;
  return (
    <span style={{ position: 'relative', width: size, height: size, borderRadius: '50%', background: 'var(--blue-dark)', color: '#fff', display: 'inline-grid', placeItems: 'center', fontSize: Math.round(size * .36), fontWeight: 700, overflow: 'hidden', flex: 'none', border: '2px solid var(--blue-soft)' }}>
      {init}{!err && <img src={url} alt="" onError={() => setErr(true)} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />}
    </span>
  );
}

function Demo(){return <div style={{display:'flex',flexDirection:'column',gap:16}}>
<div style={{display:'flex',gap:10,flexWrap:'wrap'}}><Button>Join Team OASIS</Button><Button variant="secondary">Open workspace</Button><Button variant="outline">Learn more</Button><Button variant="quiet" size="md">Browse all fixes</Button><Button disabled size="md">Disabled</Button></div>
<div style={{display:'flex',gap:10,padding:14,borderRadius:10,background:'var(--gradient-hero)'}}><Eyebrow tone="green">Welcome back</Eyebrow><Button size="md">Start reviewing</Button><Button variant="ghost-light" size="md">Browse all fixes</Button></div>
<div style={{display:'flex',gap:12,alignItems:'center'}}><Eyebrow>How it works</Eyebrow><Avatar login="alex-r"/><Avatar login="zz-no-user-x" size={40}/><Card padding={14}><b>Card</b> · line border</Card><Card padding={14} selected>Selected</Card></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
