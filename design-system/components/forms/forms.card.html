<!-- @dsCard group="Components" viewport="700x330" name="Forms & filters" subtitle="SearchInput, SegmentedFilter, Field, Checkbox" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px;background:#fff}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script></head><body><div id="root"></div>
<script type="text/babel">

function SearchInput({ value, onChange, placeholder = 'Search PR #, repo, title, or CWE…' }) {
  return (
    <label style={{ display: 'flex', alignItems: 'center', gap: 8, height: 38, padding: '0 12px', background: 'var(--white)', border: '1px solid var(--line-strong)', borderRadius: 8, color: 'var(--muted)' }}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} style={{ flex: 1, minWidth: 0, border: 0, outline: 0, background: 'transparent', fontSize: 14, color: 'var(--ink)' }}/>
    </label>
  );
}

function SegmentedFilter({ options, value, onChange }) {
  return (
    <div role="tablist" style={{ display: 'inline-flex', gap: 2, padding: 3, background: 'var(--gray-100)', border: '1px solid var(--line)', borderRadius: 9 }}>
      {options.map(o => { const on = o.id === value; return (
        <button key={o.id} role="tab" aria-selected={on} onClick={() => onChange(o.id)} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 10px', border: 0, borderRadius: 7, background: on ? 'var(--white)' : 'transparent', color: on ? 'var(--ink)' : 'var(--gray-600)', boxShadow: on ? 'var(--shadow-inset-selected)' : 'none', fontSize: 13, fontWeight: 600 }}>
          {o.label}{o.count != null && <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--muted)' }}>{o.count}</span>}
        </button> ); })}
    </div>
  );
}

function Field({ label, required, hint, error, multiline, value, onChange, placeholder }) {
  const Tag = multiline ? 'textarea' : 'input';
  return (
    <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <span style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700, letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--ink-soft)' }}>{label}{required && <span style={{ color: 'var(--dec-reject)' }}> *</span>}</span>
      <Tag value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={multiline ? 4 : undefined} aria-invalid={!!error}
        style={{ padding: '9px 12px', minHeight: multiline ? 96 : 38, border: '1px solid ' + (error ? 'var(--dec-reject)' : 'var(--line-strong)'), borderRadius: 6, background: 'var(--white)', fontSize: 14, lineHeight: 1.5, resize: 'vertical' }}/>
      {(error || hint) && <span style={{ fontSize: 12, color: error ? 'var(--dec-reject-fg)' : 'var(--muted)' }}>{error || hint}</span>}
    </label>
  );
}

function Checkbox({ checked, onChange, label, meta }) {
  return (
    <label style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 10px', borderRadius: 7, background: checked ? 'var(--blue-soft)' : 'transparent', cursor: 'pointer' }}>
      <span style={{ width: 16, height: 16, borderRadius: 4, border: '1.5px solid ' + (checked ? 'var(--blue)' : 'var(--gray-400)'), background: checked ? 'var(--blue)' : '#fff', display: 'grid', placeItems: 'center', color: '#fff', fontSize: 11, flex: 'none' }}>{checked ? '✓' : ''}</span>
      <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} style={{ position: 'absolute', opacity: 0, pointerEvents: 'none' }}/>
      <span style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink)' }}>{label}</span>
      {meta && <span style={{ marginLeft: 'auto', fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--muted)' }}>{meta}</span>}
    </label>
  );
}

function Demo(){return (()=>{const [q,setQ]=React.useState('react#14');const [f,setF]=React.useState('needs');const [c,setC]=React.useState('');const [x,setX]=React.useState(true);return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div style={{display:'flex',flexDirection:'column',gap:12}}><SearchInput value={q} onChange={setQ}/><SegmentedFilter value={f} onChange={setF} options={[{id:'needs',label:'Need my vote',count:8},{id:'open',label:'Open',count:12},{id:'trusted',label:'Trusted'},{id:'all',label:'All'}]}/><div><Checkbox checked={x} onChange={setX} label="react" meta="JavaScript"/><Checkbox checked={false} onChange={()=>{}} label="tarstream" meta="Rust"/></div></div>
<div style={{display:'flex',flexDirection:'column',gap:12}}><Field label="Comments" required multiline value={c} onChange={setC} placeholder="Explain your decision"/><Field label="Parent PR number" required value="" onChange={()=>{}} error="Required for Duplicate"/></div></div>})()}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
