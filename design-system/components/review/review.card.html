<!-- @dsCard group="Components" viewport="700x90" name="Vote bar" subtitle="VoteBar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px;background:#fff}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script></head><body><div id="root"></div>
<script type="text/babel">

const D = [['accept', 'Accept'], ['modify', 'Modify'], ['reject', 'Reject'], ['duplicate', 'Duplicate']];
function VoteBar({ value, onChange, disabled }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 8 }}>
      {D.map(([k, l]) => { const on = value === k; return (
        <button key={k} disabled={disabled} aria-pressed={on} aria-keyshortcuts={l[0]} onClick={() => onChange(on ? null : k)}
          style={{ minHeight: 42, padding: '8px 10px', borderRadius: 8, fontSize: 14, fontWeight: 700, border: `2px solid var(--dec-${k})`, background: on ? `var(--dec-${k})` : `var(--dec-${k}-bg)`, color: on ? '#fff' : `var(--dec-${k}-fg)` }}>
          <span style={{ textDecoration: 'underline', textDecorationThickness: 2, textUnderlineOffset: 3 }}>{l[0]}</span>{l.slice(1)}
        </button> ); })}
    </div>
  );
}

function Demo(){return (()=>{const [d,setD]=React.useState('accept');return <VoteBar value={d} onChange={setD}/>})()}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
